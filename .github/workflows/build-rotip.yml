name: RotIP build

on:
  push:
    branches: [rotip/mvp]
    paths: ['rotip/**', '.github/workflows/build-rotip.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate RotIP gradle project
        run: |
          cd rotip
          gradle --version

      - name: Build RotIP debug APK
        run: |
          cd rotip
          gradle :app:assembleDebug --no-daemon

      - name: Upload RotIP APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotip-debug-apk
          path: rotip/app/build/outputs/apk/debug/*.apk
