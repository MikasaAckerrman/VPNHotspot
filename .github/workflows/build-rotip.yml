name: RotIP build

on:
  push:
    branches: [rotip/mvp]
    paths: ['rotip/**', '.github/workflows/build-rotip.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RotIP APK (release if secrets present, else debug)
        env:
          ROTIP_KEYSTORE_B64: ${{ secrets.ROTIP_KEYSTORE_B64 }}
          ROTIP_KEYSTORE_PASS: ${{ secrets.ROTIP_KEYSTORE_PASS }}
        shell: bash
        run: |
          cd rotip
          if [ -n "$ROTIP_KEYSTORE_B64" ] && [ -n "$ROTIP_KEYSTORE_PASS" ]; then
            gradle :app:assembleRelease --no-daemon
            echo "RELEASE=1" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug --no-daemon
            echo "RELEASE=0" >> "$GITHUB_ENV"
          fi

      - name: Upload RotIP APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotip-debug-apk
          path: rotip/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
